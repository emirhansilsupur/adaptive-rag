<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AdaptiveRAG Studio: ask questions of your documents, check every citation, and compare retrieval pipelines side by side."
    />
    <meta name="theme-color" content="#EDEFF3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F131D" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161C2D'/%3E%3Cpath d='M11.5 8H8v16h3.5M20.5 8H24v16h-3.5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='square'/%3E%3Crect x='11.5' y='13' width='9' height='6' rx='1' fill='%23FFD21A'/%3E%3C/svg%3E"
    />
    <title>AdaptiveRAG Studio</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("adaptiverag_studio_theme_v1");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* storage unavailable: fall back to light */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
