[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "adaptiverag"
version = "0.1.0"
description = "Production-grade, query-aware Agentic RAG engine with verifiable citations, native Qdrant hybrid search, local ONNX reranking, 3-stage dynamic top-k, CRAG gating, and Langfuse v5 OTEL observability."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Emirhan Silsüpür", email = "sr.emirhn@gmail.com" }]
keywords = [
    "rag",
    "agentic-rag",
    "langgraph",
    "qdrant",
    "hybrid-search",
    "reranking",
    "crag",
    "langfuse",
    "opentelemetry",
    "fastapi",
]
dependencies = [
    "fastapi>=0.115.0",
    "fastembed>=0.6.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.40",
    "langchain-openai>=0.3.7",
    "langfuse>=5.0.0",
    "langgraph>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "pypdf>=5.3.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.13.0",
    "sse-starlette>=2.2.0",
    "structlog>=25.1.0",
    "tavily-python>=0.5.0",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.34.0",
    "duckduckgo-search>=7.5.0",
]

[project.optional-dependencies]
ui = [
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "streamlit>=1.42.0",
]
eval = [
    "datasets>=3.2.0",
    "numpy>=2.0.0",
    "ragas>=0.2.10",
    "scikit-learn>=1.6.0",
]
providers = [
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/emirhansilsupur/adaptive-rag"
Repository = "https://github.com/emirhansilsupur/adaptive-rag"
Issues = "https://github.com/emirhansilsupur/adaptive-rag/issues"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptiverag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["adaptiverag", "eval"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests requiring live Qdrant or external services",
    "live_llm: tests that make paid LLM API calls",
]
