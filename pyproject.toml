[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "adaptiverag"
version = "0.1.0"
description = "Query-aware Agentic RAG engine with native Qdrant hybrid search, dynamic top-k, cross-encoder reranking, multi-signal confidence gating, web fallback, and two-tier citation validation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fastembed>=0.6.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.40",
    "langchain-openai>=0.3.7",
    "langfuse>=2.59.0",
    "langgraph>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "pypdf>=5.3.0",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.13.0",
    "sse-starlette>=2.2.0",
    "structlog>=25.1.0",
    "tavily-python>=0.5.0",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.34.0",
    "duckduckgo-search>=7.5.0",
]

[project.optional-dependencies]
ui = [
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "streamlit>=1.42.0",
]
eval = [
    "datasets>=3.2.0",
    "numpy>=2.0.0",
    "ragas>=0.2.10",
    "scikit-learn>=1.6.0",
]
providers = [
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptiverag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests requiring live Qdrant or external services",
    "live_llm: tests that make paid LLM API calls",
]
